name: Build SmartGameBot APK
on:
  workflow_dispatch:
  push:
    branches: [smartgamebot-build-20260828]
    paths:
      - 'build_payload/**'
      - '.github/workflows/build-smartgamebot.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Rebuild source archive
        run: cat build_payload/part00.b64 build_payload/part01.b64 build_payload/part02.b64 build_payload/part03.b64 | base64 -d > SmartGameBot_source.zip
      - name: Unpack source
        run: unzip -o SmartGameBot_source.zip
      - name: Fix Java Process ambiguity
        run: sed -i 's/Process\.THREAD_PRIORITY_DISPLAY/android.os.Process.THREAD_PRIORITY_DISPLAY/' SmartGameBot/app/src/main/java/com/nixz/smartgamebot/CaptureService.java
      - name: Build debug APK
        working-directory: SmartGameBot
        run: gradle --no-daemon assembleDebug
      - name: Collect APK
        run: cp SmartGameBot/app/build/outputs/apk/debug/app-debug.apk SmartGameBot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SmartGameBot-apk
          path: SmartGameBot.apk
          if-no-files-found: error
