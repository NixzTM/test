name: Build ArenaControl APK

on:
  push:
    branches: [arena-control-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true
      - name: Decode source
        run: |
          base64 -d ArenaControl-source.zip.b64 > ArenaControl-source.zip
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q ArenaControl-source.zip -d buildsrc
      - name: Build debug APK
        working-directory: buildsrc/ArenaControl
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK
        run: |
          test -f buildsrc/ArenaControl/app/build/outputs/apk/debug/app-debug.apk
          sha256sum buildsrc/ArenaControl/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ArenaControl-debug-apk
          path: buildsrc/ArenaControl/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
