name: Build ArenaControl APK

on:
  push:
    branches: [arena-control-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply premium UI and direct transport
        working-directory: ArenaControl
        run: |
          python3 redesign_v23.py
          python3 redesign_v23_fix.py
          python3 redesign_v24.py
          python3 redesign_v25.py
          python3 redesign_v25_fix.py
          python3 redesign_v26.py
          python3 redesign_v27.py
          python3 redesign_v28.py

      - name: Verify architecture and controls
        run: |
          test -f ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          test -f ArenaControl/app/src/main/java/com/arenacommunity/control/TmnfText.java
          test -f ArenaControl/app/src/main/res/raw/arena_logo_b64.txt
          ! grep -R "WebView\|com.jcraft.jsch\|Game VPS login\|SSH password\|private key" ArenaControl/app/src/main/java
          grep -q "owner/admin" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "https://87.237.52.153:47832" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "MOBILE_CERT_SHA256" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "timer.add" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "timer.pause" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "map.previous" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "map.erase" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "vote.disable" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "vote.pass" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "bet.cancel" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "/v1/chat" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "/v1/console" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "/v1/players/search" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "/v1/bans" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "player.ban" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q 'return "LJA"' ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q 'return "HUNT #1"' ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q 'return "HUNT #2"' ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q 'chatComposer.hasFocus' ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q 'PLAYER DIRECTORY' ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q 'chatSavedY' ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q 'LATEST' ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java

      - name: Build debug APK
        working-directory: ArenaControl
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          test -f ArenaControl/app/build/outputs/apk/debug/app-debug.apk
          sha256sum ArenaControl/app/build/outputs/apk/debug/app-debug.apk

      - name: Package source
        run: zip -qr ArenaControl-native-v2.8-source.zip ArenaControl

      - uses: actions/upload-artifact@v4
        with:
          name: ArenaControl-native-v2.8
          path: |
            ArenaControl/app/build/outputs/apk/debug/app-debug.apk
            ArenaControl-native-v2.8-source.zip
          if-no-files-found: error
