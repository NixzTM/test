name: Build ArenaControl APK

on:
  push:
    branches: [arena-control-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify direct architecture
        run: |
          test -f ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          test -f ArenaControl/app/src/main/java/com/arenacommunity/control/TmnfText.java
          test -f ArenaControl/app/src/main/res/raw/remote_admin.py
          test -f ArenaControl/app/src/main/res/raw/arena_logo_b64.txt
          ! grep -R "WebView\|CookieManager\|arena-community.com" ArenaControl/app/src/main/java ArenaControl/app/src/main/res/raw
          grep -q "com.github.mwiede:jsch" ArenaControl/app/build.gradle.kts
          grep -q "Game VPS login" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "AC3" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "AC4" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "AC7" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java

      - name: Build debug APK
        working-directory: ArenaControl
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          test -f ArenaControl/app/build/outputs/apk/debug/app-debug.apk
          sha256sum ArenaControl/app/build/outputs/apk/debug/app-debug.apk

      - name: Package source
        run: zip -qr ArenaControl-native-v2.0-source.zip ArenaControl

      - uses: actions/upload-artifact@v4
        with:
          name: ArenaControl-native-v2.0
          path: |
            ArenaControl/app/build/outputs/apk/debug/app-debug.apk
            ArenaControl-native-v2.0-source.zip
          if-no-files-found: error
