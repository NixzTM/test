name: Build ArenaControl APK

on:
  push:
    branches: [arena-control-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply premium UI and direct transport
        working-directory: ArenaControl
        run: |
          python3 redesign_v23.py
          python3 redesign_v23_fix.py
          python3 redesign_v24.py
          python3 redesign_v25.py
          python3 redesign_v25_fix.py
          python3 redesign_v26.py
          python3 redesign_v27.py
          python3 redesign_v28.py
          python3 redesign_v29.py
          python3 redesign_v210.py
          python3 redesign_v211.py
          python3 redesign_v212.py
          python3 redesign_v213.py
          python3 redesign_v214.py
          python3 redesign_v215.py
          python3 redesign_v216.py
          python3 redesign_v217.py
          python3 redesign_v218.py
          python3 redesign_v219.py
          python3 redesign_v220.py
          python3 redesign_v221.py
          python3 redesign_v222.py
          python3 redesign_v223.py
          python3 redesign_v224.py
          python3 redesign_v225.py
          python3 redesign_v226.py
          python3 redesign_v227.py
          python3 redesign_v228.py

      - name: Verify architecture and controls
        run: |
          set -euxo pipefail
          J=ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          test -f "$J"
          test -f ArenaControl/app/src/main/java/com/arenacommunity/control/TmnfText.java
          test -f ArenaControl/app/src/main/res/raw/arena_logo_b64.txt
          test -f ArenaControl/app/src/main/res/drawable-nodpi/arena_app_icon.png
          grep -q 'android:icon="@drawable/arena_app_icon"' ArenaControl/app/src/main/AndroidManifest.xml
          grep -q 'android:configChanges="orientation|screenSize|keyboardHidden"' ArenaControl/app/src/main/AndroidManifest.xml
          ! grep -R "WebView\|com.jcraft.jsch\|Game VPS login\|SSH password\|private key" ArenaControl/app/src/main/java
          grep -q "owner/admin" "$J"
          grep -q "https://87.237.52.153:47832" "$J"
          grep -q "https://87.237.52.153:47834" "$J"
          grep -q "https://87.237.52.153:47837" "$J"
          grep -q "mobileBase(String srv)" "$J"
          grep -q "mobileActionFor(String srv" "$J"
          grep -q "controlServer=server" "$J"
          grep -q "submitServer=server" "$J"
          grep -q "actionServer=server" "$J"
          grep -q "rowServer=server" "$J"
          grep -q "switchServer(String srv)" "$J"
          grep -q "chatViewServer" "$J"
          grep -q "chatSignatureByServer" "$J"
          grep -q "observedChatByServer" "$J"
          grep -q "chatSnapshotKeysByServer" "$J"
          grep -q "loadServer=server" "$J"
          grep -q "pollServer=server" "$J"
          grep -q "setOnApplyWindowInsetsListener" "$J"
          test "$(grep -c 'private List<ChatLine> loadMobileChat(String srv)' "$J")" -eq 1
          test "$(grep -c 'private List<ChatLine> loadMobileChat()' "$J")" -eq 1
          grep -q '/v1/chat?limit=120' "$J"
          grep -q "chatSnapshotKeysByServer.get(srv)" "$J"
          grep -q "chatSnapshotKeysByServer.put(srv" "$J"
          grep -q "renderedPlayerNick(Player p)" "$J"
          grep -q "chatNickname" "$J"
          grep -q "insertChatCode(EditText e,String code)" "$J"
          grep -q "timer.add" "$J"
          grep -q "map.previous" "$J"
          grep -q "map.erase" "$J"
          grep -q "vote.disable" "$J"
          grep -q "bet.cancel" "$J"
          grep -q "/v1/players/search" "$J"
          grep -q "/v1/bans" "$J"
          grep -q 'addNav("PLAYERS",this::showPlayerDirectory)' "$J"
          grep -q 'PLAYER DIRECTORY' "$J"
          grep -q 'updateChatListInPlace(out.chat)' "$J"
          grep -q 'unban recorded locally but RPC failed' "$J"

      - name: Build debug APK
        working-directory: ArenaControl
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          test -f ArenaControl/app/build/outputs/apk/debug/app-debug.apk
          sha256sum ArenaControl/app/build/outputs/apk/debug/app-debug.apk

      - name: Package source
        run: zip -qr ArenaControl-native-v2.28-source.zip ArenaControl

      - uses: actions/upload-artifact@v4
        with:
          name: ArenaControl-native-v2.28
          path: |
            ArenaControl/app/build/outputs/apk/debug/app-debug.apk
            ArenaControl-native-v2.28-source.zip
          if-no-files-found: error
