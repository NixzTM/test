name: Build ArenaControl APK

on:
  push:
    branches: [arena-control-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: ArenaControl
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK
        run: |
          test -f ArenaControl/app/build/outputs/apk/debug/app-debug.apk
          sha256sum ArenaControl/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ArenaControl-debug-apk
          path: ArenaControl/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
