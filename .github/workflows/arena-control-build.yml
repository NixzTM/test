name: Build ArenaControl APK

on:
  push:
    branches: [arena-control-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply premium UI and direct transport
        working-directory: ArenaControl
        run: |
          python3 redesign_v23.py
          python3 redesign_v23_fix.py
          python3 redesign_v24.py
          python3 redesign_v25.py
          python3 redesign_v25_fix.py
          python3 redesign_v26.py
          python3 redesign_v27.py
          python3 redesign_v28.py
          python3 redesign_v29.py
          python3 redesign_v210.py
          python3 redesign_v211.py
          python3 redesign_v212.py
          python3 redesign_v213.py
          python3 redesign_v214.py
          python3 redesign_v215.py
          python3 redesign_v216.py
          python3 redesign_v217.py
          python3 redesign_v218.py
          python3 redesign_v219.py
          python3 redesign_v220.py
          python3 redesign_v221.py
          python3 redesign_v222.py
          python3 redesign_v223.py
          python3 redesign_v224.py

      - name: Verify architecture and controls
        run: |
          test -f ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          test -f ArenaControl/app/src/main/java/com/arenacommunity/control/TmnfText.java
          test -f ArenaControl/app/src/main/res/raw/arena_logo_b64.txt
          test -f ArenaControl/app/src/main/res/drawable-nodpi/arena_app_icon.png
          grep -q 'android:icon="@drawable/arena_app_icon"' ArenaControl/app/src/main/AndroidManifest.xml
          grep -q 'android:configChanges="orientation|screenSize|keyboardHidden"' ArenaControl/app/src/main/AndroidManifest.xml
          ! grep -R "WebView\|com.jcraft.jsch\|Game VPS login\|SSH password\|private key" ArenaControl/app/src/main/java
          grep -q "owner/admin" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "https://87.237.52.153:47832" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "https://87.237.52.153:47834" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "https://87.237.52.153:47837" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "mobileBase(String srv)" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "mobileActionFor(String srv" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "controlServer=server" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "submitServer=server" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "actionServer=server" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "rowServer=server" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "switchServer(String srv)" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "chatViewServer" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "chatSignatureByServer" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "chatBaselineKeyByServer" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "observedChatByServer" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "loadServer=server" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "pollServer=server" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          test "$(grep -c 'private List<ChatLine> loadMobileChat(String srv)' ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java)" -eq 1
          test "$(grep -c 'private List<ChatLine> loadMobileChat()' ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java)" -eq 1
          grep -q '/v1/chat?limit=120' ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "renderedPlayerNick(Player p)" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "chatNickname" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "insertChatCode(EditText e,String code)" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q 'String wire=chosen+"$z$fff: "+m' ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "timer.add" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "map.previous" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "map.erase" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "vote.disable" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "bet.cancel" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "/v1/players/search" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q "/v1/bans" ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q 'addNav("PLAYERS",this::showPlayerDirectory)' ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q 'PLAYER DIRECTORY' ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q 'updateChatListInPlace(out.chat)' ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java
          grep -q 'unban recorded locally but RPC failed' ArenaControl/app/src/main/java/com/arenacommunity/control/MainActivity.java

      - name: Build debug APK
        working-directory: ArenaControl
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          test -f ArenaControl/app/build/outputs/apk/debug/app-debug.apk
          sha256sum ArenaControl/app/build/outputs/apk/debug/app-debug.apk

      - name: Package source
        run: zip -qr ArenaControl-native-v2.24-source.zip ArenaControl

      - uses: actions/upload-artifact@v4
        with:
          name: ArenaControl-native-v2.24
          path: |
            ArenaControl/app/build/outputs/apk/debug/app-debug.apk
            ArenaControl-native-v2.24-source.zip
          if-no-files-found: error
