name: Build AutoPilot Match3 v0.5
on:
  workflow_dispatch:
  push:
    branches: [autopilot2d-smartgames-20260828]
    paths:
      - 'v04src/Match3Bot.java'
      - '.github/workflows/build-autopilot-v05.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Rebuild base source
        run: cat autopilot_payload/chunk00.bin autopilot_payload/chunk01.bin autopilot_payload/chunk02.bin autopilot_payload/chunk03.bin autopilot_payload/chunk04.bin autopilot_payload/tail00.bin autopilot_payload/tail01.bin autopilot_payload/tail02.bin autopilot_payload/tail03.bin autopilot_payload/tail04.bin autopilot_payload/tail05.bin > AutoPilot2D-smartgames-source.zip
      - name: Unpack
        run: unzip -o AutoPilot2D-smartgames-source.zip
      - name: Install v0.5 Match3 engine
        shell: bash
        run: |
          cp v04src/Match3Bot.java AutoPilot2D/app/src/main/java/com/nixz/autopilot2d/Match3Bot.java
          python3 - <<'PY'
          from pathlib import Path

          # Replace +1 detector with a detector for the ACTUAL badge visible in the supplied crops:
          # a dark, nearly vertical J-like stroke in the upper-left translucent bubble.
          p=Path('AutoPilot2D/app/src/main/java/com/nixz/autopilot2d/Vision.java')
          s=p.read_text()
          a=s.index('    static boolean plusBadge(')
          z=s.index('    static boolean specialOverlay', a)
          repl='''    static boolean plusBadge(PixelFrame b,float cx,float cy,float radius,int baseType){
              int w=b.width(),h=b.height();
              int x0=Math.max(0,(int)(cx-radius*1.10f));
              int x1=Math.min(w-1,(int)(cx-radius*.34f));
              int y0=Math.max(0,(int)(cy-radius*1.16f));
              int y1=Math.min(h-1,(int)(cy-radius*.12f));
              if(x1<=x0||y1<=y0)return false;
              int bestRun=0,bestColumnDark=0;
              for(int x=x0;x<=x1;x+=Math.max(1,(int)(radius*.035f))){
                  int run=0,maxRun=0,dark=0,total=0;
                  for(int y=y0;y<=y1;y+=Math.max(1,(int)(radius*.025f))){
                      int c=b.argbAt(x,y);
                      int R=Color.red(c),G=Color.green(c),B=Color.blue(c);
                      int lum=(R*3+G*4+B)/8;
                      boolean d=lum<150 && Math.max(R,Math.max(G,B))-Math.min(R,Math.min(G,B))<80;
                      total++;
                      if(d){dark++;run++;if(run>maxRun)maxRun=run;}else run=0;
                  }
                  bestRun=Math.max(bestRun,maxRun);
                  if(total>0)bestColumnDark=Math.max(bestColumnDark,(dark*100)/total);
              }
              // The badge's black J creates a tall continuous vertical stroke. Normal tile art is white.
              return bestRun>=Math.max(7,(int)(radius*.34f)) && bestColumnDark>=26;
          }

          '''
          p.write_text(s[:a]+repl+s[z:])

          # Make +1 an ABSOLUTE objective, not merely a large score bonus.
          p=Path('AutoPilot2D/app/src/main/java/com/nixz/autopilot2d/Match3Bot.java')
          s=p.read_text()
          old='''    private Move findBest(Cell[][] board,boolean lookahead){
        Move best=null;
        for(int r=0;r<ROWS;r++) for(int c=0;c<COLS;c++){
            if(c+1<COLS){ Move m=eval(board,r,c,r,c+1,lookahead); if(m!=null&&(best==null||m.score>best.score))best=m; }
            if(r+1<ROWS){ Move m=eval(board,r,c,r+1,c,lookahead); if(m!=null&&(best==null||m.score>best.score))best=m; }
        }
        return best;
    }
'''
          new='''    private Move findBest(Cell[][] board,boolean lookahead){
        Move best=null, bestPlus=null;
        for(int r=0;r<ROWS;r++) for(int c=0;c<COLS;c++){
            if(c+1<COLS){
                Move m=eval(board,r,c,r,c+1,lookahead);
                if(m!=null){
                    if(clearsPlus(board,m)){ if(bestPlus==null||m.score>bestPlus.score)bestPlus=m; }
                    if(best==null||m.score>best.score)best=m;
                }
            }
            if(r+1<ROWS){
                Move m=eval(board,r,c,r+1,c,lookahead);
                if(m!=null){
                    if(clearsPlus(board,m)){ if(bestPlus==null||m.score>bestPlus.score)bestPlus=m; }
                    if(best==null||m.score>best.score)best=m;
                }
            }
        }
        return bestPlus!=null ? bestPlus : best;
    }

    private boolean clearsPlus(Cell[][] src,Move m){
        Cell[][] b=copy(src);
        Cell t=b[m.r1][m.c1];b[m.r1][m.c1]=b[m.r2][m.c2];b[m.r2][m.c2]=t;
        MatchInfo mi=findMatches(b);
        for(int idx:mi.cells) if(b[idx/COLS][idx%COLS].plus) return true;
        return false;
    }
'''
          if old not in s: raise SystemExit('findBest block not found')
          s=s.replace(old,new)
          s=s.replace('boolean targetsPlus = board[best.r1][best.c1].plus || board[best.r2][best.c2].plus;\n        BotRuntime.setStatus(targetsPlus ? "Match-3: +1 priority move" : "Match-3: best planned move");', 'boolean targetsPlus = clearsPlus(board,best);\n        int plusCount=0; for(int rr=0;rr<ROWS;rr++)for(int cc=0;cc<COLS;cc++)if(board[rr][cc].plus)plusCount++;\n        BotRuntime.setStatus(targetsPlus ? ("Match-3: CLEARING +1 (seen "+plusCount+")") : ("Match-3: planning; +1 seen "+plusCount));')
          p.write_text(s)

          # Version only. Bubble is intentionally untouched in this build.
          p=Path('AutoPilot2D/app/build.gradle')
          s=p.read_text()
          import re
          s=re.sub(r'versionCode\s+\d+','versionCode 5',s)
          s=re.sub(r'versionName\s+[\"\'][^\"\']+[\"\']','versionName "0.5-match3-plus"',s)
          p.write_text(s)
          PY
      - name: Build APK
        working-directory: AutoPilot2D
        run: gradle --no-daemon assembleDebug
      - name: Collect and verify APK
        run: |
          cp AutoPilot2D/app/build/outputs/apk/debug/app-debug.apk SmartGameBot-AutoPilot-v0.5-Match3.apk
          test -s SmartGameBot-AutoPilot-v0.5-Match3.apk
          unzip -t SmartGameBot-AutoPilot-v0.5-Match3.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: SmartGameBot-AutoPilot-v0.5-Match3-apk
          path: SmartGameBot-AutoPilot-v0.5-Match3.apk
          if-no-files-found: error
