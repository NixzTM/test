name: Build AutoPilot Match3 AI v1.0
on:
  workflow_dispatch:
  push:
    branches: [autopilot2d-smartgames-20260828]
    paths:
      - 'v07src/**'
      - 'scripts/patch_match3_expectimax_v10.py'
      - '.github/workflows/build-autopilot-v07.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Rebuild base source
        run: cat autopilot_payload/chunk00.bin autopilot_payload/chunk01.bin autopilot_payload/chunk02.bin autopilot_payload/chunk03.bin autopilot_payload/chunk04.bin autopilot_payload/tail00.bin autopilot_payload/tail01.bin autopilot_payload/tail02.bin autopilot_payload/tail03.bin autopilot_payload/tail04.bin autopilot_payload/tail05.bin > AutoPilot2D-source.zip
      - name: Unpack
        run: unzip -o AutoPilot2D-source.zip
      - name: Install Match3 AI
        run: cp v07src/Match3Bot.java AutoPilot2D/app/src/main/java/com/nixz/autopilot2d/Match3Bot.java
      - name: Apply sampled expectimax planner
        run: python3 scripts/patch_match3_expectimax_v10.py
      - name: Restore persistent floating controller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('AutoPilot2D/app/src/main/java/com/nixz/autopilot2d/BotAccessibilityService.java')
          s=p.read_text()
          s=s.replace('''        if (BotRuntime.captureReady) {\n            showOverlay();\n        }''','''        showOverlay();''')
          s=s.replace('title.setText("CAR FLYER");','title.setText("MATCH-3 AI");')
          p.write_text(s)
          PY
      - name: Build APK
        working-directory: AutoPilot2D
        run: gradle --no-daemon assembleDebug
      - name: Collect and verify APK
        run: |
          cp AutoPilot2D/app/build/outputs/apk/debug/app-debug.apk SmartGameBot-AutoPilot-v1.0-Match3-AI.apk
          test -s SmartGameBot-AutoPilot-v1.0-Match3-AI.apk
          unzip -t SmartGameBot-AutoPilot-v1.0-Match3-AI.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: SmartGameBot-AutoPilot-v1.0-Match3-AI-apk
          path: SmartGameBot-AutoPilot-v1.0-Match3-AI.apk
          if-no-files-found: error
