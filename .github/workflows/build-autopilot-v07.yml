name: Build AutoPilot Match3 AI v1.0
on:
  workflow_dispatch:
  push:
    branches: [autopilot2d-smartgames-20260828]
    paths:
      - 'v07src/**'
      - '.github/workflows/build-autopilot-v07.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Rebuild base source
        run: cat autopilot_payload/chunk00.bin autopilot_payload/chunk01.bin autopilot_payload/chunk02.bin autopilot_payload/chunk03.bin autopilot_payload/chunk04.bin autopilot_payload/tail00.bin autopilot_payload/tail01.bin autopilot_payload/tail02.bin autopilot_payload/tail03.bin autopilot_payload/tail04.bin autopilot_payload/tail05.bin > AutoPilot2D-source.zip
      - name: Unpack
        run: unzip -o AutoPilot2D-source.zip
      - name: Install Match3 AI
        run: cp v07src/Match3Bot.java AutoPilot2D/app/src/main/java/com/nixz/autopilot2d/Match3Bot.java
      - name: Apply sampled expectimax planner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('AutoPilot2D/app/src/main/java/com/nixz/autopilot2d/Match3Bot.java')
          s=p.read_text()
          s=s.replace('private final HashSet<String> rejectedMoves=new HashSet<>();','private final HashSet<String> rejectedMoves=new HashSet<>();\n    private final Random rng=new Random();')
          old='''        for(Move m:legal){
            m.score=immediateScore(board.c,m);
            m.after=simulate(board.c,m);
            if(m.after!=null){
                double future=search(m.after,2,.58);
                if(hasImmediatePlusClear(m.after)) m.score += 250000;
                m.score += future;
            }
            if(m.clearsPlus) m.score += 1000000;
        }'''
          new='''        int[] dist=colorDistribution(board.c);
        for(Move m:legal){
            m.score=immediateScore(board.c,m);
            m.after=simulate(board.c,m);
            if(m.after!=null){
                if(hasImmediatePlusClear(m.after)) m.score += 300000;
                m.score += sampledExpectimax(m.after, dist, 3, 6, .62);
            }
            if(m.clearsPlus) m.score += 2000000;
        }'''
          if old not in s: raise SystemExit('main planner block not found')
          s=s.replace(old,new)
          old2='''    private double search(Cell[][] b,int depth,double discount){
        if(depth<=0)return heuristic(b)*discount; List<Move> moves=legalMoves(b,false); if(moves.isEmpty())return heuristic(b)*discount;
        for(Move m:moves){m.score=immediateScore(b,m);m.after=simulate(b,m);if(m.clearsPlus)m.score+=1000000;} moves.sort((a,z)->Double.compare(z.score,a.score));
        double best=-1e18; for(int i=0;i<Math.min(8,moves.size());i++){Move m=moves.get(i);double v=m.score;if(m.after!=null)v+=search(m.after,depth-1,discount*.58);best=Math.max(best,v);} return best*discount;
    }'''
          new2='''    private int[] colorDistribution(Cell[][] b){
        int[] d=new int[8]; int total=0;
        for(int r=0;r<ROWS;r++)for(int c=0;c<COLS;c++) if(b[r][c].type>=0&&b[r][c].type<d.length){d[b[r][c].type]++;total++;}
        if(total==0){for(int i=0;i<6;i++)d[i]=1;}
        return d;
    }

    private int randomColor(int[] dist){
        int total=0; for(int v:dist)total+=v; if(total<=0)return rng.nextInt(6);
        int x=rng.nextInt(total); for(int i=0;i<dist.length;i++){x-=dist[i];if(x<0)return i;} return 0;
    }

    private Cell[][] refillSample(Cell[][] src,int[] dist){
        Cell[][] b=copy(src);
        for(int r=0;r<ROWS;r++)for(int c=0;c<COLS;c++) if(b[r][c].type==EMPTY) b[r][c]=new Cell(randomColor(dist),false,false,1);
        return b;
    }

    private double sampledExpectimax(Cell[][] after,int[] dist,int depth,int chanceSamples,double discount){
        if(depth<=0)return heuristic(after)*discount;
        double total=0;
        for(int sample=0;sample<chanceSamples;sample++){
            Cell[][] state=refillSample(after,dist);
            // Resolve accidental cascades from the random refill before choosing the next move.
            for(int cascade=0;cascade<3;cascade++){
                MatchInfo mi=findMatches(state); if(mi.cells.isEmpty())break;
                for(int idx:mi.cells)state[idx/COLS][idx%COLS]=new Cell(EMPTY,false,false,1);
                for(int c=0;c<COLS;c++){int wr=ROWS-1;for(int r=ROWS-1;r>=0;r--)if(state[r][c].type!=EMPTY)state[wr--][c]=state[r][c];while(wr>=0)state[wr--][c]=new Cell(randomColor(dist),false,false,1);}
            }
            List<Move> moves=legalMoves(state,false);
            if(moves.isEmpty()){total+=heuristic(state);continue;}
            for(Move m:moves){m.score=immediateScore(state,m);m.after=simulate(state,m);if(m.clearsPlus)m.score+=2000000;}
            moves.sort((a,z)->Double.compare(z.score,a.score));
            double best=-1e18;
            int beam=Math.min(7,moves.size());
            for(int i=0;i<beam;i++){
                Move m=moves.get(i); double v=m.score;
                if(m.after!=null) v+=sampledExpectimax(m.after,dist,depth-1,Math.max(2,chanceSamples/2),discount*.62);
                if(v>best)best=v;
            }
            total+=best;
        }
        return (total/Math.max(1,chanceSamples))*discount;
    }'''
          if old2 not in s: raise SystemExit('search block not found')
          s=s.replace(old2,new2)
          s=s.replace('BotRuntime.setStatus("Match-3 AI: +1="+board.plusCount+", +1 clears="+plusLegal+", moves="+legal.size());','BotRuntime.setStatus("Match-3 AI: +1="+board.plusCount+", clears="+plusLegal+", expectimax d3 x6");')
          p.write_text(s)
          PY
      - name: Restore persistent floating controller and gesture pass-through
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('AutoPilot2D/app/src/main/java/com/nixz/autopilot2d/BotAccessibilityService.java')
          s=p.read_text()
          s=s.replace('''        if (BotRuntime.captureReady) {\n            showOverlay();\n        }''','''        showOverlay();''')
          s=s.replace('title.setText("CAR FLYER");','title.setText("MATCH-3 AI");')
          old='''    public static boolean tapPixels(float x, float y, long durationMs) {\n        BotAccessibilityService service = instance;\n        if (service == null || !BotRuntime.running) return false;\n        Path path = new Path();\n        path.moveTo(x, y);\n        GestureDescription.StrokeDescription stroke =\n                new GestureDescription.StrokeDescription(path, 0, Math.max(1, durationMs));\n        return service.dispatchGesture(new GestureDescription.Builder().addStroke(stroke).build(), null, null);\n    }\n\n    public static boolean swipePixels(float x1, float y1, float x2, float y2, long durationMs) {\n        BotAccessibilityService service = instance;\n        if (service == null || !BotRuntime.running) return false;\n        Path path = new Path();\n        path.moveTo(x1, y1);\n        path.lineTo(x2, y2);\n        GestureDescription.StrokeDescription stroke =\n                new GestureDescription.StrokeDescription(path, 0, Math.max(40, durationMs));\n        return service.dispatchGesture(new GestureDescription.Builder().addStroke(stroke).build(), null, null);\n    }'''
          new='''    public static boolean tapPixels(float x, float y, long durationMs) {\n        BotAccessibilityService service = instance;\n        if (service == null || !BotRuntime.running) return false;\n        Path path = new Path(); path.moveTo(x, y);\n        GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(path, 0, Math.max(1, durationMs));\n        return service.dispatchGameGesture(new GestureDescription.Builder().addStroke(stroke).build());\n    }\n\n    public static boolean swipePixels(float x1, float y1, float x2, float y2, long durationMs) {\n        BotAccessibilityService service = instance;\n        if (service == null || !BotRuntime.running) return false;\n        Path path = new Path(); path.moveTo(x1, y1); path.lineTo(x2, y2);\n        GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(path, 0, Math.max(40, durationMs));\n        return service.dispatchGameGesture(new GestureDescription.Builder().addStroke(stroke).build());\n    }\n\n    private boolean dispatchGameGesture(GestureDescription gesture) {\n        setOverlayPassThrough(true);\n        boolean ok = dispatchGesture(gesture, new GestureResultCallback() {\n            @Override public void onCompleted(GestureDescription g) { mainHandler.postDelayed(() -> setOverlayPassThrough(false), 40); }\n            @Override public void onCancelled(GestureDescription g) { mainHandler.postDelayed(() -> setOverlayPassThrough(false), 40); }\n        }, null);\n        if (!ok) mainHandler.post(() -> setOverlayPassThrough(false));\n        return ok;\n    }\n\n    private void setOverlayPassThrough(boolean pass) {\n        if (overlay == null || overlayParams == null || windowManager == null) return;\n        int old = overlayParams.flags;\n        if (pass) overlayParams.flags |= WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE;\n        else overlayParams.flags &= ~WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE;\n        if (old != overlayParams.flags) { try { windowManager.updateViewLayout(overlay, overlayParams); } catch (RuntimeException ignored) {} }\n    }'''
          if old in s: s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('AutoPilot2D/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+','versionCode 10',s)
          s=re.sub(r'versionName\s+[\"\'][^\"\']+[\"\']','versionName "1.0-match3-expectimax"',s)
          p.write_text(s)
          PY
      - name: Build APK
        working-directory: AutoPilot2D
        run: gradle --no-daemon assembleDebug
      - name: Collect and verify APK
        run: |
          cp AutoPilot2D/app/build/outputs/apk/debug/app-debug.apk SmartGameBot-AutoPilot-v1.0-Match3-AI.apk
          test -s SmartGameBot-AutoPilot-v1.0-Match3-AI.apk
          unzip -t SmartGameBot-AutoPilot-v1.0-Match3-AI.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: SmartGameBot-AutoPilot-v1.0-Match3-AI-apk
          path: SmartGameBot-AutoPilot-v1.0-Match3-AI.apk
          if-no-files-found: error
