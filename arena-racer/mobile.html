<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#31a9f4">
<title>Arena Racer — Mobile</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#31a9f4;font-family:Arial,sans-serif;color:#fff}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#31a9f4;font-weight:900;letter-spacing:1px}
</style>
</head>
<body>
<div id="loading">LOADING ARENA RACER…</div>
<script>
(async()=>{
  let s=await (await fetch('./index.html?mobile=1',{cache:'no-store'})).text();
  const rep=(a,b)=>{if(!s.includes(a))console.warn('mobile patch missed',a.slice(0,90));s=s.split(a).join(b)};

  // Rendering: preserve physics, slash mobile draw cost.
  rep("const $=q=>document.querySelector(q);\nconst canvas=$('#game');\nconst renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});",
      "const $=q=>document.querySelector(q);\nconst canvas=$('#game');\nconst MOBILE=true;\nconst renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance',alpha:false,stencil:false});");
  rep("renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));","renderer.setPixelRatio(1);");
  rep("renderer.toneMapping=THREE.ACESFilmicToneMapping;","renderer.toneMapping=THREE.NoToneMapping;");
  rep("renderer.shadowMap.enabled=true;","renderer.shadowMap.enabled=false;");
  rep("sun.position.set(-120,170,80);sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);","sun.position.set(-120,170,80);sun.castShadow=false;sun.shadow.mapSize.set(512,512);");
  rep("function box(w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.castShadow=true;o.receiveShadow=true;return o}",
      "function box(w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.castShadow=false;o.receiveShadow=false;return o}");
  rep("for(let i=0;i<22;i++)addVoxelCloud","for(let i=0;i<10;i++)addVoxelCloud");
  rep("const g=new THREE.Group(),cell=4.8,levels=Math.ceil(h/cell)","const g=new THREE.Group(),cell=7.2,levels=Math.ceil(h/cell)");
  rep("for(let i=0;i<32;i++){const a=rnd()*Math.PI*2,rr=72+rnd()*275;","for(let i=0;i<14;i++){const a=rnd()*Math.PI*2,rr=72+rnd()*275;");
  rep("for(let i=0;i<N;i+=10){if(isGap(i))continue;","for(let i=0;i<N;i+=16){if(isGap(i))continue;");
  rep("for(let i=0;i<N;i+=9){if(isGap(i))continue;","for(let i=0;i<N;i+=15){if(isGap(i))continue;");
  rep("for(let i=45;i<N;i+=110){if(isGap(i))continue;","for(let i=45;i<N;i+=160){if(isGap(i))continue;");
  rep("const c=new THREE.CatmullRomCurve3(points.map(v=>new THREE.Vector3(...v)),false,'catmullrom',.12),count=180,ps=[],ts=[],ls=[];",
      "const c=new THREE.CatmullRomCurve3(points.map(v=>new THREE.Vector3(...v)),false,'catmullrom',.12),count=90,ps=[],ts=[],ls=[];");
  rep("if(skids.length>130)","if(skids.length>70)");
  rep("renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));camera.aspect=innerWidth/innerHeight;","renderer.setPixelRatio(1);camera.aspect=innerWidth/innerHeight;");

  // Replace D-pad with analog steering joystick + right-side accelerator/brake.
  rep(`<div class="controls"><button id="up" class="ctrl" aria-label="Accelerate">▲</button><button id="left" class="ctrl" aria-label="Steer left">◀</button><button id="down" class="ctrl" aria-label="Brake">▼</button><button id="right" class="ctrl" aria-label="Steer right">▶</button><button id="restart" class="ctrl" aria-label="Restart">↻</button></div>`,
      `<div class="controls"><div id="stickBase" aria-label="Steering joystick"><div id="stickKnob"></div></div><button id="brakeBtn" class="pedal brake" aria-label="Brake">BRAKE</button><button id="gasBtn" class="pedal gas" aria-label="Accelerate">GAS</button><button id="restart" class="ctrl" aria-label="Restart">↻</button></div>`);

  rep("@media(pointer:fine){.controls{opacity:.72}}",
`#stickBase{position:absolute;pointer-events:auto;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;border:2px solid #ffffff52;background:radial-gradient(circle,#163f68b8 0 28%,#0b2744aa 29% 100%);box-shadow:0 5px 16px #0019,inset 0 0 0 8px #ffffff08;touch-action:none}
#stickKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:linear-gradient(#2a73a9,#123b60);border:2px solid #bfe8ff99;box-shadow:0 3px 10px #0009;transform:translate(0,0);pointer-events:none}
.pedal{position:absolute;pointer-events:auto;right:max(18px,env(safe-area-inset-right));border:1px solid #ffffff66;color:white;font-weight:1000;text-shadow:0 2px 2px #0008;box-shadow:0 4px 12px #0008,inset 0 0 0 2px #ffffff0d;touch-action:none}
.pedal.gas{bottom:max(18px,env(safe-area-inset-bottom));width:82px;height:82px;border-radius:50%;background:linear-gradient(#55c825,#23820c);font-size:18px}
.pedal.brake{bottom:max(110px,calc(env(safe-area-inset-bottom) + 110px));width:72px;height:72px;border-radius:50%;background:linear-gradient(#cf432d,#7b1e13);font-size:13px}
.pedal.active,.pedal:active{transform:scale(.96);filter:brightness(1.18)}
@media(pointer:fine){.controls{opacity:.82}}`);

  // Analog joystick logic and corrected steering direction.
  rep("hold('#left','left');hold('#right','right');hold('#up','up');hold('#down','down');$('#restart').addEventListener('pointerdown',e=>{e.preventDefault();respawn();audioOn()});",
`hold('#gasBtn','up');hold('#brakeBtn','down');
function setupJoystick(){
 const base=$('#stickBase'),knob=$('#stickKnob');let active=null;
 const reset=()=>{input.left=0;input.right=0;knob.style.transform='translate(0px,0px)'};
 const move=e=>{const r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.31,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}const nx=dx/max;input.left=nx<-.08?Math.min(1,-nx):0;input.right=nx>.08?Math.min(1,nx):0;knob.style.transform='translate('+dx+'px,'+dy+'px)'};
 base.addEventListener('pointerdown',e=>{e.preventDefault();active=e.pointerId;base.setPointerCapture(active);move(e);audioOn()});
 base.addEventListener('pointermove',e=>{if(e.pointerId===active)move(e)});
 const end=e=>{if(e.pointerId===active){active=null;reset()}};base.addEventListener('pointerup',end);base.addEventListener('pointercancel',end);reset();
}
setupJoystick();$('#restart').addEventListener('pointerdown',e=>{e.preventDefault();respawn();audioOn()});`);

  rep("const rawL=input.left||keys.has('ArrowLeft')||keys.has('KeyA'),rawR=input.right||keys.has('ArrowRight')||keys.has('KeyD'),rawU=(input.up||keys.has('ArrowUp')||keys.has('KeyW'))&&state.running,rawD=input.down||keys.has('ArrowDown')||keys.has('KeyS');\n const steerTarget=(rawR?1:0)-(rawL?1:0);",
      "const rawL=Math.max(input.left,keys.has('ArrowLeft')||keys.has('KeyA')?1:0),rawR=Math.max(input.right,keys.has('ArrowRight')||keys.has('KeyD')?1:0),rawU=(input.up||keys.has('ArrowUp')||keys.has('KeyW'))&&state.running,rawD=input.down||keys.has('ArrowDown')||keys.has('KeyS');\n const steerTarget=rawL-rawR;");

  // Keep the restart out of the pedal area.
  s=s.replace('#restart{right:max(12px,env(safe-area-inset-right));top:105px;', '#restart{right:max(18px,env(safe-area-inset-right));top:98px;');

  document.open();document.write(s);document.close();
})().catch(err=>{document.getElementById('loading').textContent='LOAD ERROR: '+err.message});
</script>
</body>
</html>
