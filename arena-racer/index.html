<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Arena Racer — Voxel Stunt Circuit</title>
<style>
:root{--panel:rgba(8,37,72,.88);--line:rgba(157,224,255,.38);--lime:#70f02d;--yellow:#ffe84a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#43b7f5;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;inset:0;z-index:5;pointer-events:none;user-select:none;text-shadow:0 2px 3px #001b}
.panel{background:linear-gradient(#143f73ed,#082746ed);border:1px solid var(--line);box-shadow:0 4px 13px #0018,inset 0 0 0 1px #fff1;border-radius:5px;backdrop-filter:blur(2px)}
#timer{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(9px,env(safe-area-inset-top));padding:6px 9px;min-width:128px}
#time{font-size:30px;line-height:1;font-weight:1000;letter-spacing:.4px}#best{font-size:10px;font-weight:1000;color:var(--yellow);margin-top:4px}
#records{position:absolute;left:max(10px,env(safe-area-inset-left));top:79px;width:146px;padding:7px 9px;font-size:10px;line-height:1.45}#records b{font-size:9px;letter-spacing:.8px}.rec{display:flex;justify-content:space-between;gap:8px}.rec.me{color:#ffe84a}
#race{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(9px,env(safe-area-inset-top));width:74px;display:grid;gap:6px;text-align:center}.rbox{padding:5px}.rbox small{display:block;font-size:8px;font-weight:1000}.rbox strong{display:block;font-size:24px;line-height:1}.rbox.pos strong{font-size:20px}
#speedHud{position:absolute;right:max(11px,env(safe-area-inset-right));bottom:max(11px,env(safe-area-inset-bottom));text-align:right}#speed{font-size:39px;line-height:.86;font-weight:1000}.unit{font-size:11px;font-weight:1000}.meter{width:126px;height:8px;margin:7px 0 0 auto;display:flex;gap:2px}.meter i{flex:1;background:#273947;transform:skewX(-16deg)}.meter i.on{background:#6bf126}.meter i.hot{background:#ff9815}
#toast{position:absolute;left:50%;top:13%;transform:translateX(-50%) scale(.95);opacity:0;padding:6px 12px;font-size:11px;font-weight:1000;letter-spacing:.7px;transition:.12s;white-space:nowrap}#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
#count{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-size:min(18vw,120px);font-weight:1000;font-style:italic;opacity:0;transition:.1s;filter:drop-shadow(0 6px 0 #0019)}#count.show{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
#title{position:absolute;left:50%;top:max(9px,env(safe-area-inset-top));transform:translateX(-50%);background:#0c3768c9;border:1px solid #91ddff55;border-radius:4px;padding:5px 9px;font-size:9px;font-weight:1000;letter-spacing:1.2px;white-space:nowrap}

#stick{position:absolute;pointer-events:auto;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:122px;height:122px;border-radius:50%;border:2px solid #d8f3ff77;background:radial-gradient(circle,#1a5c8ebc 0 31%,#0a2947b8 32% 100%);box-shadow:0 5px 15px #0019,inset 0 0 0 8px #ffffff0a;touch-action:none}

.pedal,.smallbtn{position:absolute;pointer-events:auto;color:#fff;border:1px solid #ffffff77;box-shadow:0 4px 12px #0018,inset 0 0 0 2px #ffffff0e;text-shadow:0 2px 2px #001a;font-weight:1000;touch-action:none}.pedal:active,.pedal.active,.smallbtn:active{transform:scale(.96);filter:brightness(1.15)}
#gas{right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;background:linear-gradient(#5ad22a,#25880c);font-size:18px}
#brake{right:max(23px,calc(env(safe-area-inset-right) + 5px));bottom:max(112px,calc(env(safe-area-inset-bottom) + 112px));width:72px;height:72px;border-radius:50%;background:linear-gradient(#dc4931,#801e13);font-size:13px}
#restart{right:max(16px,env(safe-area-inset-right));top:104px;width:43px;height:43px;border-radius:9px;background:linear-gradient(#1a537f,#0b2d4d);font-size:18px}
#landscape{display:none;position:absolute;left:50%;bottom:4px;transform:translateX(-50%);background:#0008;border-radius:4px;padding:4px 7px;font-size:9px;white-space:nowrap}
@media(max-width:720px){#time{font-size:25px}#timer{min-width:110px}#records{top:70px;width:129px;font-size:9px}#race{width:66px}.rbox strong{font-size:21px}#speed{font-size:33px}#title{font-size:8px}}
@media(orientation:portrait) and (max-width:720px){#records,#title,.rbox.pos{display:none}#landscape{display:block}#stick{width:118px;height:118px}#gas{width:82px;height:82px}#brake{width:70px;height:70px}}

</style>

<body>
<canvas id="game"></canvas>
<div class="hud">
 <div id="timer" class="panel"><div id="time">0:00.00</div><div id="best">BEST --:--.--</div></div>
 <div id="records" class="panel"><b>RECORDS</b><div class="rec me"><span>1 YOU</span><span id="me">--:--.--</span></div><div class="rec"><span>2 NEO</span><span>0:43.18</span></div><div class="rec"><span>3 PIXL</span><span>0:43.91</span></div><div class="rec"><span>4 JUMP</span><span>0:44.27</span></div><div class="rec"><span>5 ZEN</span><span>0:45.66</span></div></div>
 <div id="race"><div class="rbox panel"><small>LAP</small><strong id="lap">1/3</strong></div><div class="rbox pos panel"><small>POSITION</small><strong>1/8</strong></div></div>
 <div id="title">ARENA RACER // VOXEL SKYLINE</div><div id="toast" class="panel">CHECKPOINT</div><div id="count">3</div>
 <div id="speedHud"><div><span id="speed">0</span> <span class="unit">KM/H</span></div><div id="meter" class="meter"></div></div><div id="landscape">LANDSCAPE RECOMMENDED</div>
</div>
<div class="controls"><div id="stick"><div id="knob"></div></div><button id="brake" class="pedal">BRAKE</button><button id="gas" class="pedal">GAS</button><button id="restart" class="smallbtn">↻</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const $=q=>document.querySelector(q), canvas=$('#game');
const MOBILE=matchMedia('(pointer:coarse)').matches || innerWidth<900;
const renderer=new THREE.WebGLRenderer({canvas,antialias:!MOBILE,powerPreference:'high-performance',stencil:false});
renderer.setSize(innerWidth,innerHeight,false);renderer.setPixelRatio(Math.min(devicePixelRatio,MOBILE?1.05:1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=MOBILE?THREE.NoToneMapping:THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.04;renderer.shadowMap.enabled=false;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x43b7f5);scene.fog=new THREE.Fog(0x82cef7,210,640);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,1100);
scene.add(new THREE.HemisphereLight(0xf7fcff,0x49723d,2.4));const sun=new THREE.DirectionalLight(0xffefd1,3.4);sun.position.set(-90,150,80);scene.add(sun);
const MAT={road:new THREE.MeshStandardMaterial({color:0x30363a,roughness:.93,side:THREE.DoubleSide}),side:new THREE.MeshStandardMaterial({color:0x20262a,roughness:1,side:THREE.DoubleSide}),white:new THREE.MeshStandardMaterial({color:0xf3f5f2,roughness:.7}),orange:new THREE.MeshStandardMaterial({color:0xf4a914,roughness:.7}),black:new THREE.MeshStandardMaterial({color:0x16191b,roughness:.95}),boost:new THREE.MeshStandardMaterial({color:0x6cea2b,emissive:0x1b7d09,emissiveIntensity:MOBILE?.25:.65,roughness:.55}),grass:new THREE.MeshLambertMaterial({color:0x72dc43}),grass2:new THREE.MeshLambertMaterial({color:0x56be39}),dirt:new THREE.MeshLambertMaterial({color:0x76593b}),dirt2:new THREE.MeshLambertMaterial({color:0x5d4934}),leaf:new THREE.MeshLambertMaterial({color:0x2ba04a}),wood:new THREE.MeshLambertMaterial({color:0x734727}),cloud:new THREE.MeshLambertMaterial({color:0xffffff}),water:new THREE.MeshLambertMaterial({color:0x158ed0})};
const unitBox=new THREE.BoxGeometry(1,1,1);function meshBox(w,h,d,m,x=0,y=0,z=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);return o}
const water=meshBox(1100,2,1100,MAT.water,0,-21,0);scene.add(water);

let seed=94321;const rnd=()=>((seed=Math.imul(seed,1664525)+1013904223|0)>>>0)/4294967296;
const vox={grass:[],grass2:[],dirt:[],dirt2:[],leaf:[],wood:[],cloud:[]};
function pushVoxel(kind,x,y,z,sx=1,sy=1,sz=1){vox[kind].push([x,y,z,sx,sy,sz])}
function island(cx,cz,r=18,h=24){const cell=5.8,levels=Math.max(2,Math.ceil(h/cell)),top=-19+(levels-1)*cell;for(let ly=0;ly<levels;ly++){const rr=r-(levels-1-ly)*1.3,n=Math.ceil(rr/cell);for(let ix=-n;ix<=n;ix++)for(let iz=-n;iz<=n;iz++){const x=ix*cell,z=iz*cell;if(Math.hypot(x,z)>rr*(.83+rnd()*.14))continue;pushVoxel(((ix+iz+ly)&1)?'dirt':'dirt2',cx+x,-19+ly*cell,cz+z,cell+.08,cell+.08,cell+.08)}}const n=Math.ceil(r/cell);for(let ix=-n;ix<=n;ix++)for(let iz=-n;iz<=n;iz++){const x=ix*cell,z=iz*cell;if(Math.hypot(x,z)>r*.86||rnd()>.91)continue;pushVoxel(((ix+iz)&1)?'grass':'grass2',cx+x,top+3.8,cz+z,cell+.1,1.8,cell+.1)}const trees=Math.max(1,Math.floor(r/11));for(let t=0;t<trees;t++){const a=rnd()*Math.PI*2,rr=rnd()*r*.45,x=cx+Math.cos(a)*rr,z=cz+Math.sin(a)*rr,y=top+5.2,s=.8+rnd()*.25;pushVoxel('wood',x,y+3*s,z,2*s,6*s,2*s);for(let yy=0;yy<2;yy++)for(let xx=-1;xx<=1;xx++)for(let zz=-1;zz<=1;zz++){if(yy&&Math.abs(xx)+Math.abs(zz)>1)continue;pushVoxel('leaf',x+xx*3*s,y+(7+yy*2.7)*s,z+zz*3*s,3.7*s,3.7*s,3.7*s)}}}
const islandCount=MOBILE?15:24;for(let i=0;i<islandCount;i++){const a=rnd()*Math.PI*2,rr=58+rnd()*260;island(Math.cos(a)*rr,Math.sin(a)*rr,10+rnd()*22,10+rnd()*31)}
const cloudCount=MOBILE?8:16;for(let i=0;i<cloudCount;i++){const cx=(rnd()-.5)*540,cy=75+rnd()*100,cz=(rnd()-.5)*540,s=.7+rnd()*1.3;for(const [x,y,z] of [[-2,0,0],[-1,0,0],[0,0,0],[1,0,0],[2,0,0],[-1,1,0],[0,1,0],[1,1,0],[0,2,0],[0,0,1]])if(rnd()>.15)pushVoxel('cloud',cx+x*5.8*s,cy+y*4.5*s,cz+z*4.8*s,7*s,5*s,6*s)}
const mats={grass:MAT.grass,grass2:MAT.grass2,dirt:MAT.dirt,dirt2:MAT.dirt2,leaf:MAT.leaf,wood:MAT.wood,cloud:MAT.cloud};const dummy=new THREE.Object3D();for(const k of Object.keys(vox)){const arr=vox[k];if(!arr.length)continue;const inst=new THREE.InstancedMesh(unitBox,mats[k],arr.length);inst.frustumCulled=true;for(let i=0;i<arr.length;i++){const [x,y,z,sx,sy,sz]=arr[i];dummy.position.set(x,y,z);dummy.scale.set(sx,sy,sz);dummy.rotation.set(0,0,0);dummy.updateMatrix();inst.setMatrixAt(i,dummy.matrix)}inst.instanceMatrix.needsUpdate=true;scene.add(inst)}

const P=[[0,24,116],[0,24,76],[0,24,36],[4,28,-3],[14,37,-40],[37,46,-70],[70,50,-83],[102,46,-70],[126,38,-42],[138,30,-6],[134,25,34],[116,22,70],[87,21,96],[53,22,111],[17,24,117],[-20,28,111],[-53,35,94],[-80,42,67],[-97,45,34],[-103,41,-2],[-95,34,-37],[-75,29,-68],[-47,25,-88],[-17,23,-91],[3,23,-71],[12,23,-39],[10,23,-3],[5,23,36],[2,23,78]].map(v=>new THREE.Vector3(...v));
const curve=new THREE.CatmullRomCurve3(P,true,'catmullrom',.13),N=1500,roadHalf=7.4,roadDepth=1.15,C=[],T=[],L=[];const UP=new THREE.Vector3(0,1,0);
for(let i=0;i<N;i++){const p=curve.getPointAt(i/N),t=curve.getTangentAt(i/N).normalize(),l=new THREE.Vector3(-t.z,0,t.x);if(l.lengthSq()<1e-5)l.set(1,0,0);l.normalize();C.push(p);T.push(t);L.push(l)}
const gaps=[[235,285],[790,825]],boostRanges=[[60,115],[515,560],[1110,1160]],range=(i,r)=>i>=r[0]&&i<=r[1],isGap=i=>gaps.some(r=>range(i,r)),isBoost=i=>boostRanges.some(r=>range(i,r));
function buildRoad(){const pos=[],idx=[];const addv=v=>{pos.push(v.x,v.y,v.z);return pos.length/3-1};for(let i=0;i<N;i++){const j=(i+1)%N;if(isGap(i)||isGap(j))continue;const a=C[i],b=C[j],la=L[i],lb=L[j];const atl=a.clone().addScaledVector(la,roadHalf),atr=a.clone().addScaledVector(la,-roadHalf),btl=b.clone().addScaledVector(lb,roadHalf),btr=b.clone().addScaledVector(lb,-roadHalf);const abl=atl.clone();abl.y-=roadDepth;const abr=atr.clone();abr.y-=roadDepth;const bbl=btl.clone();bbl.y-=roadDepth;const bbr=btr.clone();bbr.y-=roadDepth;let v=[atl,atr,btl,btr,abl,abr,bbl,bbr].map(addv);idx.push(v[0],v[1],v[2],v[1],v[3],v[2], v[4],v[6],v[5],v[5],v[6],v[7], v[0],v[2],v[4],v[4],v[2],v[6], v[1],v[5],v[3],v[5],v[7],v[3])}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();return g}
scene.add(new THREE.Mesh(buildRoad(),MAT.road));
function instancedTrackBoxes(entries,material){const inst=new THREE.InstancedMesh(unitBox,material,entries.length);for(let i=0;i<entries.length;i++){const e=entries[i];dummy.position.copy(e.p);dummy.scale.set(e.sx,e.sy,e.sz);dummy.quaternion.setFromAxisAngle(UP,e.yaw);dummy.updateMatrix();inst.setMatrixAt(i,dummy.matrix)}inst.instanceMatrix.needsUpdate=true;scene.add(inst);return inst}
const lines=[],orange=[],black=[],boosts=[];for(let i=0;i<N;i+=14){if(isGap(i))continue;const yaw=Math.atan2(T[i].x,T[i].z);if(i%28===0)lines.push({p:C[i].clone().add(new THREE.Vector3(0,.1,0)),sx:.18,sy:.07,sz:3,yaw});for(const side of [-1,1])lines.push({p:C[i].clone().addScaledVector(L[i],side*(roadHalf-.34)).add(new THREE.Vector3(0,.1,0)),sx:.18,sy:.07,sz:3,yaw})}
for(let i=0;i<N;i+=12){if(isGap(i))continue;const yaw=Math.atan2(T[i].x,T[i].z);for(const side of [-1,1]){const e={p:C[i].clone().addScaledVector(L[i],side*(roadHalf+.05)).add(new THREE.Vector3(0,.43,0)),sx:.72,sy:.86,sz:2.55,yaw};(((i/12+(side>0?1:0))|0)&1?orange:black).push(e)}}
for(let i=0;i<N;i+=13){if(!isBoost(i)||isGap(i))continue;const yaw=Math.atan2(T[i].x,T[i].z);boosts.push({p:C[i].clone().add(new THREE.Vector3(0,.12,0)),sx:9.8,sy:.08,sz:2.8,yaw})}
instancedTrackBoxes(lines,MAT.white);instancedTrackBoxes(orange,MAT.orange);instancedTrackBoxes(black,MAT.black);instancedTrackBoxes(boosts,MAT.boost);

function signTex(top,bottom){const c=document.createElement('canvas');c.width=384;c.height=144;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.fillStyle='#082b61';x.fillRect(0,0,384,144);x.strokeStyle='#9ce1ff';x.lineWidth=7;x.strokeRect(4,4,376,136);x.textAlign='center';x.fillStyle='#fff';x.font='900 50px Arial';x.fillText(top,192,62);x.fillStyle='#75ef37';x.font='900 35px Arial';x.fillText(bottom,192,112);const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.colorSpace=THREE.SRGBColorSpace;return t}
function sign(i,top,bottom,side=0){const yaw=Math.atan2(T[i].x,T[i].z),p=C[i];const board=new THREE.Mesh(new THREE.PlaneGeometry(12.5,4.7),new THREE.MeshBasicMaterial({map:signTex(top,bottom),side:THREE.DoubleSide}));board.position.copy(p).addScaledVector(L[i],side).add(new THREE.Vector3(0,7.1,0));board.rotation.y=yaw;scene.add(board);for(const s of [-1,1]){const pole=meshBox(.28,7,.28,MAT.black);pole.position.copy(p).addScaledVector(L[i],side+s*5.25);pole.position.y+=3.5;scene.add(pole)}}
sign(83,'NEXT LEVEL','▲ ▲ ▲');sign(535,'PIXEL','STUNTS',-13);sign(1135,'TURBO','BOOST',12);
function gate(i,m=MAT.orange){const yaw=Math.atan2(T[i].x,T[i].z),p=C[i];for(const s of [-1,1]){const q=meshBox(.6,6.2,.6,m);q.position.copy(p).addScaledVector(L[i],s*(roadHalf-.5));q.position.y+=3.1;scene.add(q)}const b=meshBox(roadHalf*2-.9,.55,.55,m);b.position.copy(p);b.position.y+=6.2;b.rotation.y=yaw;scene.add(b)}
const checkpoints=[205,470,745,1045];gate(8,MAT.boost);checkpoints.forEach(i=>gate(i));

function carModel(){const g=new THREE.Group(),blue=new THREE.MeshStandardMaterial({color:0x087dea,roughness:.42}),blue2=new THREE.MeshStandardMaterial({color:0x0559b0,roughness:.48}),glass=new THREE.MeshStandardMaterial({color:0x153b59,roughness:.25,metalness:.35}),dark=new THREE.MeshLambertMaterial({color:0x10151a});const add=(w,h,d,m,x,y,z)=>{const q=meshBox(w,h,d,m,x,y,z);g.add(q);return q};add(2.65,.42,4.4,blue,0,.72,0);add(2.05,.29,1.55,blue2,0,.94,1.65);add(1.6,.62,1.5,glass,0,1.22,.16);add(.4,.48,3.65,MAT.white,0,.99,.03);add(3.35,.16,.6,dark,0,1.3,-1.95);add(.15,.7,.15,dark,-1.22,1.02,-1.78);add(.15,.7,.15,dark,1.22,1.02,-1.78);for(const x of [-1.36,1.36])for(const z of [-1.3,1.3])add(.44,.66,.92,dark,x,.48,z);for(const x of [-.62,.62])add(.26,.19,.13,MAT.orange,x,.62,2.24);const jets=[];const jm=new THREE.MeshBasicMaterial({color:0x64ddff,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false});for(const x of [-.56,.56]){const j=add(.18,.18,1.6,jm,x,.59,-2.72);j.visible=false;jets.push(j)}g.userData={jets};return g}
const car=carModel();scene.add(car);const shadow=new THREE.Mesh(new THREE.PlaneGeometry(3.1,4.6),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.22,depthWrite:false}));shadow.rotation.x=-Math.PI/2;scene.add(shadow);

const input={steer:0,gas:0,brake:0},keys=new Set();function bindPedal(el,key){let pid=null;el.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;el.setPointerCapture(pid);input[key]=1;el.classList.add('active');audioOn()});const end=e=>{if(pid===e.pointerId){pid=null;input[key]=0;el.classList.remove('active')}};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}bindPedal($('#gas'),'gas');bindPedal($('#brake'),'brake');
(()=>{const base=$('#stick'),knob=$('#knob');let pid=null;const reset=()=>{input.steer=0;knob.style.transform='translate(0px,0px)'};const move=e=>{const r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.31;let dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}const nx=dx/max;input.steer=Math.abs(nx)<.08?0:nx;knob.style.transform=`translate(${dx}px,${dy}px)`};base.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;base.setPointerCapture(pid);move(e);audioOn()});base.addEventListener('pointermove',e=>{if(e.pointerId===pid)move(e)});const end=e=>{if(e.pointerId===pid){pid=null;reset()}};base.addEventListener('pointerup',end);base.addEventListener('pointercancel',end);reset()})();
$('#restart').addEventListener('pointerdown',e=>{e.preventDefault();respawn();audioOn()});addEventListener('keydown',e=>{keys.add(e.code);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyR')respawn();audioOn()},{passive:false});addEventListener('keyup',e=>keys.delete(e.code));

let actx,osc1,osc2,gain,filter,noise,ng;function audioOn(){if(actx){if(actx.state==='suspended')actx.resume();return}actx=new(window.AudioContext||window.webkitAudioContext)();osc1=actx.createOscillator();osc2=actx.createOscillator();gain=actx.createGain();filter=actx.createBiquadFilter();osc1.type='sawtooth';osc2.type='square';filter.type='lowpass';osc1.frequency.value=60;osc2.frequency.value=30;gain.gain.value=.013;filter.frequency.value=600;osc1.connect(filter);osc2.connect(filter);filter.connect(gain).connect(actx.destination);osc1.start();osc2.start();const b=actx.createBuffer(1,actx.sampleRate,actx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.15;noise=actx.createBufferSource();noise.buffer=b;noise.loop=true;ng=actx.createGain();ng.gain.value=.001;noise.connect(ng).connect(actx.destination);noise.start()}

const FIXED=1/120,state={pos:new THREE.Vector3(),vel:new THREE.Vector3(),yaw:0,pitch:0,vy:0,grounded:true,idx:10,speed:0,steer:0,throttle:0,brake:0,air:0,lap:1,cp:0,respawn:10,running:false,startAt:0,elapsed:0,cool:0,boost:0};
function place(i){i=(i+N)%N;state.pos.copy(C[i]);state.pos.y+=.7;state.vel.set(0,0,0);state.yaw=Math.atan2(T[i].x,T[i].z);state.pitch=-Math.asin(THREE.MathUtils.clamp(T[i].y,-.42,.42));state.vy=0;state.grounded=true;state.idx=i;state.speed=0;state.steer=state.throttle=state.brake=state.air=0}
function respawn(){place(state.respawn||10)}
function nearest(pos){let best=state.idx,score=1e12;for(let o=-80;o<=80;o+=2){const i=(state.idx+o+N)%N,p=C[i],dx=pos.x-p.x,dz=pos.z-p.z,dy=pos.y-p.y,s=dx*dx+dz*dz+dy*dy*.72;if(s<score){score=s;best=i}}if(score>2600){for(let i=0;i<N;i+=18){const p=C[i],dx=pos.x-p.x,dz=pos.z-p.z,dy=pos.y-p.y,s=dx*dx+dz*dz+dy*dy*.72;if(s<score){score=s;best=i}}}return best}
const fmt=s=>{const m=Math.floor(s/60),r=s-m*60;return`${m}:${r.toFixed(2).padStart(5,'0')}`},bestKey='arena-racer-rebuild-best';let best=Number(localStorage.getItem(bestKey)||0);if(best){$('#best').textContent='BEST '+fmt(best);$('#me').textContent=fmt(best)}const segs=[];for(let i=0;i<12;i++){const q=document.createElement('i');$('#meter').appendChild(q);segs.push(q)}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),800)}
function finishLap(){if(state.lap<3){state.lap++;state.cp=0;state.respawn=10;$('#lap').textContent=state.lap+'/3';toast('LAP '+state.lap+' / 3');return}state.running=false;const t=(performance.now()-state.startAt)/1000;state.elapsed=t;toast('FINISH  '+fmt(t));if(!best||t<best){best=t;localStorage.setItem(bestKey,best);$('#best').textContent='BEST '+fmt(best);$('#me').textContent=fmt(best)}setTimeout(countdown,1800)}
function gates(dt){state.cool=Math.max(0,state.cool-dt);if(!state.running||state.cool)return;const target=checkpoints[state.cp];if(target!==undefined){let d=Math.abs(state.idx-target);d=Math.min(d,N-d);if(d<10){state.cp++;state.respawn=(target+8)%N;state.cool=.7;toast('CHECKPOINT '+state.cp+' / 4')}}else{let d=Math.min(state.idx,N-state.idx);if(d<11){state.cool=1.2;finishLap()}}}
function countdown(){state.lap=1;state.cp=0;state.respawn=10;place(10);$('#lap').textContent='1/3';state.running=false;let n=3,e=$('#count');const go=()=>{e.textContent=n?String(n):'GO!';e.classList.add('show');setTimeout(()=>e.classList.remove('show'),580);if(!n){state.running=true;state.startAt=performance.now();state.elapsed=0;return}n--;setTimeout(go,740)};go()}setTimeout(countdown,450);
let camKick=0;
function physics(dt){const keySteer=(keys.has('ArrowRight')||keys.has('KeyD')?1:0)-(keys.has('ArrowLeft')||keys.has('KeyA')?1:0),targetSteer=THREE.MathUtils.clamp(input.steer+keySteer,-1,1),gas=(input.gas||keys.has('ArrowUp')||keys.has('KeyW'))&&state.running,brake=input.brake||keys.has('ArrowDown')||keys.has('KeyS');state.steer+=THREE.MathUtils.clamp(targetSteer-state.steer,-6.2*dt,6.2*dt);state.throttle+=THREE.MathUtils.clamp((gas?1:0)-state.throttle,-(gas?3.4:5.2)*dt,(gas?3.4:5.2)*dt);state.brake+=THREE.MathUtils.clamp((brake?1:0)-state.brake,-8.5*dt,8.5*dt);
 const f=new THREE.Vector3(Math.sin(state.yaw),0,Math.cos(state.yaw)),r=new THREE.Vector3(f.z,0,-f.x);let lon=state.vel.dot(f),lat=state.vel.dot(r),abs=Math.abs(lon),sn=Math.min(1,abs/95);
 if(state.grounded){const engine=(30*(1-.58*sn)+3)*state.throttle;lon+=engine*dt;if(state.brake>.02){if(lon>2)lon-=48*state.brake*dt;else if(lon<-2)lon+=42*state.brake*dt;else if(!gas)lon-=16*state.brake*dt}lon+=(-22*T[state.idx].y)*dt;lon-=(.00125*lon*Math.abs(lon)+.018*lon)*dt;const steerGain=(.72+1.0*Math.min(1,abs/38))*(1-THREE.MathUtils.clamp((abs-70)/100,0,.28));state.yaw+=state.steer*steerGain*dt*Math.sign(lon||1);const slide=(state.brake>.28&&Math.abs(state.steer)>.25&&abs>27)||(abs>78&&Math.abs(state.steer)>.82);lat*=Math.exp(-(slide?3.1:THREE.MathUtils.lerp(13,7.3,sn))*dt);if(slide)lon*=Math.exp(-.12*dt)}else{lon*=Math.pow(state.brake>.15?.9915:(state.throttle>.15?1:.9982),dt/FIXED);lat*=Math.pow(.9988,dt/FIXED);state.yaw+=state.steer*(.32+.15*Math.min(1,state.air))*dt;state.air+=dt;state.vy-=28*dt;if(state.brake>.2)state.vy*=Math.pow(.9992,dt/FIXED)}
 state.vel.copy(f.multiplyScalar(lon)).add(r.multiplyScalar(lat));state.idx=nearest(state.pos);const p=C[state.idx],la=L[state.idx],rel=state.pos.clone().sub(p),side=rel.dot(la),surf=p.y+.7,gap=isGap(state.idx),inside=Math.abs(side)<roadHalf+.8;
 if(!gap&&state.grounded&&Math.abs(side)>roadHalf-.55&&Math.abs(side)<roadHalf+1.5){const s=Math.sign(side)||1;state.pos.addScaledVector(la,-s*(Math.abs(side)-(roadHalf-.55)));const out=state.vel.dot(la)*s;if(out>0)state.vel.addScaledVector(la,-s*out*1.55);state.vel.multiplyScalar(.994);camKick=Math.max(camKick,.06)}
 const future=(state.idx+7)%N,leaving=!gap&&isGap(future);if(state.grounded&&leaving&&state.speed>17){state.vy=Math.max(4.5,T[state.idx].y*Math.max(0,lon)+3.8);state.grounded=false;state.air=.001}
 state.pos.x+=state.vel.x*dt;state.pos.z+=state.vel.z*dt;if(!state.grounded)state.pos.y+=state.vy*dt;
 const nearSurface=state.pos.y>=surf-.22&&state.pos.y<=surf+1.25;if(!gap&&inside&&nearSurface&&state.vy<=3.5){if(!state.grounded){const impact=Math.abs(state.vy),roadYaw=Math.atan2(T[state.idx].x,T[state.idx].z),diff=Math.abs(Math.atan2(Math.sin(state.yaw-roadYaw),Math.cos(state.yaw-roadYaw))),loss=THREE.MathUtils.clamp((impact-6)/35,0,.16)+THREE.MathUtils.clamp((diff-.4)/1.4,0,.18);state.vel.multiplyScalar(1-loss);camKick=Math.max(camKick,THREE.MathUtils.clamp(impact/60,0,.26))}state.grounded=true;state.air=0;state.vy=0;state.pos.y+=(surf-state.pos.y)*Math.min(1,30*dt)}else if(!leaving)state.grounded=false;
 if(state.grounded){state.pos.y=surf;state.pitch=THREE.MathUtils.lerp(state.pitch,-Math.asin(THREE.MathUtils.clamp(T[state.idx].y,-.38,.38)),1-Math.exp(-16*dt))}else state.pitch=THREE.MathUtils.lerp(state.pitch,THREE.MathUtils.clamp(-state.vy*.014,-.28,.22),1-Math.exp(-4*dt));
 if(isBoost(state.idx)&&state.grounded){const t=T[state.idx],along=state.vel.dot(t);if(along<108)state.vel.addScaledVector(t,31*dt);state.boost=Math.min(1,state.boost+dt*5)}else state.boost=Math.max(0,state.boost-dt*1.6);state.speed=Math.hypot(state.vel.x,state.vel.z);if(state.pos.y<-35)respawn();gates(dt)}

const camPos=new THREE.Vector3(),camVel=new THREE.Vector3(),lookPos=new THREE.Vector3();function spring(target,dt){const k=46,d=12;camVel.addScaledVector(target.clone().sub(camPos),k*dt);camVel.multiplyScalar(Math.exp(-d*dt));camPos.addScaledVector(camVel,dt)}
function visual(dt){car.position.copy(state.pos);car.rotation.order='YXZ';car.rotation.y=state.yaw;car.rotation.x=state.pitch;car.rotation.z=THREE.MathUtils.lerp(car.rotation.z,-state.steer*Math.min(.075,state.speed*.0009),1-Math.exp(-9*dt));car.userData.jets.forEach(j=>{j.visible=state.boost>.06;j.scale.z=.65+state.boost*1.5});shadow.position.set(state.pos.x,C[state.idx].y+.045,state.pos.z);shadow.material.opacity=state.grounded?.21:.055;
 const f=new THREE.Vector3(Math.sin(state.yaw),0,Math.cos(state.yaw)),n=THREE.MathUtils.clamp(state.speed/95,0,1),target=state.pos.clone().addScaledVector(f,-(7.5+n*2.4)).add(new THREE.Vector3(0,3.05+n*.7+(state.grounded?0:THREE.MathUtils.clamp(state.vy*.03,-.3,.9)),0));spring(target,dt);if(camKick>0){camKick=Math.max(0,camKick-dt*1.8);camPos.x+=(Math.random()-.5)*camKick;camPos.y+=(Math.random()-.5)*camKick*.6}camera.position.copy(camPos);const wantLook=state.pos.clone().addScaledVector(f,6+n*10.5).add(new THREE.Vector3(0,.85+(state.grounded?0:THREE.MathUtils.clamp(state.vy*.10,-1.8,3.6)),0));lookPos.lerp(wantLook,1-Math.exp(-10*dt));camera.lookAt(lookPos);camera.fov=THREE.MathUtils.lerp(camera.fov,68+n*12+(state.grounded?0:2),1-Math.exp(-3.3*dt));camera.updateProjectionMatrix();$('#speed').textContent=Math.round(state.speed*3.6);segs.forEach((q,i)=>{q.classList.toggle('on',i/12<Math.min(1,state.speed/100));q.classList.toggle('hot',state.boost>.1&&i>8)});if(state.running)state.elapsed=(performance.now()-state.startAt)/1000;$('#time').textContent=fmt(state.elapsed);if(actx&&osc1){const rpm=58+state.speed*4.4;osc1.frequency.setTargetAtTime(rpm,actx.currentTime,.04);osc2.frequency.setTargetAtTime(rpm*.5,actx.currentTime,.04);filter.frequency.setTargetAtTime(380+state.speed*21,actx.currentTime,.06);gain.gain.setTargetAtTime(.012+Math.min(.035,state.speed*.00042),actx.currentTime,.07);ng.gain.setTargetAtTime(.001+Math.abs(state.steer)*state.speed*.000017,actx.currentTime,.08)}renderer.render(scene,camera)}

place(10);camPos.copy(state.pos).add(new THREE.Vector3(0,3.2,8));lookPos.copy(state.pos);let acc=0,last=performance.now()/1000;function loop(ms){requestAnimationFrame(loop);const now=ms/1000,dt=Math.min(.05,now-last);last=now;acc=Math.min(.2,acc+dt);while(acc>=FIXED){physics(FIXED);acc-=FIXED}visual(dt)}requestAnimationFrame(loop);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);renderer.setPixelRatio(Math.min(devicePixelRatio,MOBILE?1.05:1.5));camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
